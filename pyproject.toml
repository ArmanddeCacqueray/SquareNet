[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "squarenet"
version = "1.3.10"
description = "Gridification for point clouds in any dimension (fast greedy optimal transport through Cartesian Sort)."
authors = [{ name = "ArmanddeCacqueray", email = "armanddecacqueray@sfr.fr" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "requests",
]

[project.urls]
"Homepage" = "https://github.com/ArmanddeCacqueray/SquareNet"
"Source" = "https://github.com/ArmanddeCacqueray/SquareNet"
"Documentation" = "https://squarenet.readthedocs.io"
PyPI = "https://pypi.org/project/squarenet/"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["data*"]